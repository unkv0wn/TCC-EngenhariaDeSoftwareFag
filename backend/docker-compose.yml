services:
  postgres:
    image: postgres:16-alpine
    container_name: routewise-postgres
    environment:
      POSTGRES_DB: routewise
      POSTGRES_USER: routewise
      POSTGRES_PASSWORD: routewise
    ports:
      - "5434:5432"
    volumes:
      - routewise-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U routewise -d routewise"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  routewise-postgres-data:
