# ─────────────────────────────────────────────────────────────────────────────
# RouteWise Backend — Application Configuration
# ─────────────────────────────────────────────────────────────────────────────

spring.application.name=routewise-backend
server.port=8080

# ── Java 21 Virtual Threads ──────────────────────────────────────────────────
# Enables Loom virtual threads for all Spring-managed thread pools (web, async)
spring.threads.virtual.enabled=true

# ── OSRM Configuration ───────────────────────────────────────────────────────
# Base URL for the OSRM routing API.
# Default: public demo (rate-limited). For production, point to self-hosted.
routewise.osrm.base-url=https://router.project-osrm.org
# HTTP read timeout in milliseconds (per OSRM call)
routewise.osrm.timeout-ms=10000

# ── OSM Graph (optional) ─────────────────────────────────────────────────────
# Local OSM data file path. Leave blank to disable the OSM graph service.
# Supported formats: .osm (XML), .pbf (Protocol Buffers)
# Example: routewise.osm.data-path=/data/sao-paulo.osm.pbf
routewise.osm.data-path=

# ── SSE Emitter ──────────────────────────────────────────────────────────────
# TTL for SSE emitters in milliseconds (3 minutes)
routewise.sse.timeout-ms=180000

# ── Database ─────────────────────────────────────────────────────────────────
# Flyway owns the schema — Hibernate only validates entities against it,
# never generates DDL on its own.
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5434}/${DB_NAME:routewise}
spring.datasource.username=${DB_USER:routewise}
spring.datasource.password=${DB_PASSWORD:routewise}
spring.jpa.hibernate.ddl-auto=validate
spring.flyway.enabled=true

# ── Actuator ─────────────────────────────────────────────────────────────────
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always

# ── Logging ──────────────────────────────────────────────────────────────────
logging.level.com.routewise=INFO
logging.pattern.console=%d{HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n

# ── JWT
#
# O segredo vem do ambiente. Antes estava escrito aqui e o repositório é público, o que
# tornava forjável qualquer token assinado com ele — inclusive a sessão do motorista, que
# o MobileAuthFilter aceita pela assinatura. Quem lesse o repositório entrava sem senha e
# sem aparelho cadastrado.
#
# O valor abaixo é só para desenvolvimento local e está aqui de propósito, para o projeto
# subir sem configuração. NÃO use em nada exposto: defina JWT_SECRET no ambiente.
# O mesmo valor precisa estar em FrontEnd-Next/.env.local, que é quem valida o cookie.
routewise.jwt.secret=${JWT_SECRET:dev-only-nao-use-em-producao-troque-pelo-ambiente}
routewise.jwt.expiration-ms=${JWT_EXPIRATION_MS:3600000}